# Local infrastructure for development: PostgreSQL + Redis.
# Credentials come from your .env file (run `npm run setup:env` first) - nothing is hardcoded here.
#
#   docker compose up -d        start
#   docker compose down         stop (data is kept in named volumes)
#   docker compose down -v      stop and delete all data
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run "npm run setup:env" or set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run "npm run setup:env" or set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Run "npm run setup:env" or set POSTGRES_DB in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
